<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Thirumana Nilayam | M9S Event Management - Premium Wedding Planning</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700;800&family=Nunito:wght@400;500;600;700;800;900&family=Noto+Serif+Tamil:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --ruby: #9B1B3A;
      --ruby-dark: #6E1028;
      --ruby-deep: #4A0A1C;
      --ruby-light: #C4476A;
      --ruby-pale: #FCEEF2;
      --gold: #C9952A;
      --gold-dark: #9A6E14;
      --gold-light: #F0C96A;
      --gold-pale: #FDF5E4;
      --gold-shine: #FFE8A0;
      --jade: #1A6B4A;
      --jade-light: #E6F5EE;
      --sapphire: #1B3D9B;
      --sapphire-l: #EEF2FF;
      --ink: #1C0A14;
      --ink-soft: #3D1F2A;
      --muted: #8C6E78;
      --cream: #FEFAF5;
      --warm-white: #FFFBF7;
      --border: #F0D8DE;
      --border-gold: #EDD5A0;
      --sh-xs: 0 1px 4px rgba(155,27,58,0.06);
      --sh-sm: 0 4px 12px rgba(155,27,58,0.09);
      --sh-md: 0 8px 28px rgba(155,27,58,0.12);
      --sh-lg: 0 16px 48px rgba(155,27,58,0.15);
      --sh-gold: 0 6px 20px rgba(201,149,42,0.25);
      --ff-display: 'Cormorant Garamond', serif;
      --ff-body: 'Nunito', sans-serif;
      --ff-tamil: 'Noto Serif Tamil', serif;
      --ease: cubic-bezier(0.4, 0, 0.2, 1);
    }

    html { scroll-behavior: smooth; }
    body {
      font-family: var(--ff-body);
      background: var(--cream);
      color: var(--ink);
      line-height: 1.6;
      overflow-x: hidden;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--cream); }
    ::-webkit-scrollbar-thumb { background: var(--ruby-light); border-radius: 3px; }

    body::before {
      content: "";
      position: fixed; inset: 0;
      background: radial-gradient(ellipse 80% 60% at 10% 20%, rgba(155,27,58,0.04) 0%, transparent 60%),
                  radial-gradient(ellipse 60% 80% at 90% 80%, rgba(201,149,42,0.05) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    .serif { font-family: var(--ff-display); }
    h1, h2, h3 { font-family: var(--ff-display); font-weight: 700; line-height: 1.2; }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideInRight { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @keyframes modalPop { from { transform: scale(0.92) translateY(16px); opacity: 0; } to { transform: scale(1) translateY(0); opacity: 1; } }
    @keyframes goldFlow { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 9px; padding: 13px 30px; border-radius: 50px;
      font-family: var(--ff-body); font-weight: 700; font-size: 14px;
      cursor: pointer; transition: all 0.3s var(--ease); border: none;
      white-space: nowrap;
    }
    .btn-primary { background: linear-gradient(135deg, var(--ruby) 0%, var(--ruby-light) 100%); color: #fff; box-shadow: 0 4px 16px rgba(155,27,58,0.35); }
    .btn-primary:hover { background: linear-gradient(135deg, var(--ruby-dark) 0%, var(--ruby) 100%); transform: translateY(-2px); }
    .btn-outline { background: rgba(255,255,255,0.92); border: 2px solid var(--ruby); color: var(--ruby); backdrop-filter: blur(6px); }
    .btn-outline:hover { background: var(--ruby); color: #fff; transform: translateY(-2px); }
    .btn-sm { padding: 9px 20px; font-size: 12.5px; }
    .btn-full { width: 100%; }
    .btn-gold { background: linear-gradient(135deg, var(--gold), var(--gold-light)); color: var(--ruby-deep); box-shadow: var(--sh-gold); }

    .navbar {
      background: rgba(255,255,255,0.97);
      backdrop-filter: blur(16px);
      position: sticky; top: 0; z-index: 900;
      border-bottom: 1px solid var(--border);
    }
    .nav-container {
      max-width: 1300px; margin: 0 auto; padding: 0 28px;
      height: 68px; display: flex; align-items: center; justify-content: space-between;
    }
    .logo {
      font-family: var(--ff-display); font-size: 26px; font-weight: 700;
      color: var(--ruby); display: flex; align-items: center; gap: 10px;
      cursor: pointer;
    }
    .logo i { font-size: 28px; color: var(--gold); }
    .nav-links { display: flex; align-items: center; gap: 8px; }
    .nav-links a, .nav-links span, .nav-links button {
      font-weight: 600; font-size: 13.5px; cursor: pointer;
      text-decoration: none; padding: 8px 14px; border-radius: 8px;
      transition: all 0.2s;
    }
    .nav-links a { color: var(--ink-soft); background: none; }
    .nav-links a:hover { color: var(--ruby); background: var(--ruby-pale); }
    .menu-toggle { display: none; background: none; border: none; font-size: 24px; color: var(--ruby); cursor: pointer; }
    .mobile-menu { display: none; flex-direction: column; background: #fff; border-top: 1px solid var(--border); padding: 16px 24px; gap: 4px; }
    .mobile-menu.show { display: flex; }
    .mobile-menu a { padding: 12px 16px; font-weight: 600; cursor: pointer; }

    .hero {
      position: relative;
      min-height: 85vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: linear-gradient(135deg, rgba(74,10,28,0.85), rgba(155,27,58,0.75), rgba(201,149,42,0.7));
    }
    .hero-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
    }
    .hero-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, rgba(74,10,28,0.6), rgba(155,27,58,0.5), rgba(201,149,42,0.4));
      z-index: 0;
    }
    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 820px;
      padding: 80px 32px;
    }
    .hero-title { font-size: clamp(38px, 7vw, 72px); color: #fff; font-weight: 700; margin-bottom: 22px; }
    .gold-text { background: linear-gradient(90deg, var(--gold-shine), var(--gold-light), var(--gold-shine)); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: goldFlow 4s linear infinite; }
    .stats { display: flex; justify-content: center; gap: 0; margin-top: 48px; flex-wrap: wrap; }
    .stat-item { padding: 20px 40px; border-right: 1px solid rgba(255,255,255,0.15); text-align: center; }
    .stat-number { font-family: var(--ff-display); font-size: 42px; font-weight: 700; background: linear-gradient(90deg, var(--gold-shine), #fff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .stat-label { font-size: 13px; color: rgba(255,255,255,0.6); }

    .container { max-width: 1300px; margin: 0 auto; padding: 0 28px; }
    section { padding: 80px 0; }
    .section-title { font-size: clamp(28px, 4vw, 42px); color: var(--ruby); margin-bottom: 14px; text-align: center; }
    .section-subtitle { text-align: center; color: var(--muted); margin-bottom: 48px; font-size: 16px; max-width: 700px; margin-left: auto; margin-right: auto; }
    .grid-2, .grid-3, .grid-4 { display: grid; gap: 28px; }
    .grid-2 { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
    .grid-3 { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
    .grid-4 { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }

    /* Profile Cards */
    .profile-card {
      background: #fff;
      border-radius: 20px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.35s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      border: 1px solid #eee;
    }
    .profile-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 30px -12px rgba(155, 27, 58, 0.2);
      border-color: var(--gold-light);
    }
    .profile-avatar {
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .profile-avatar i { font-size: 64px; color: rgba(255,255,255,0.9); }
    .avatar-grad-1 { background: linear-gradient(135deg, #9B1B3A, #C4476A); }
    .avatar-grad-2 { background: linear-gradient(135deg, #1A6B4A, #4CAF7D); }
    .avatar-grad-3 { background: linear-gradient(135deg, #1B3D9B, #4A6FD8); }
    .avatar-grad-4 { background: linear-gradient(135deg, #C9952A, #F0C96A); }
    .avatar-grad-5 { background: linear-gradient(135deg, #6B1B9B, #9B4DD8); }
    .avatar-grad-6 { background: linear-gradient(135deg, #D97706, #F59E0B); }
    .avatar-grad-7 { background: linear-gradient(135deg, #0F766E, #14B8A6); }
    .avatar-grad-8 { background: linear-gradient(135deg, #BE123C, #F43F5E); }

    .profile-info { padding: 20px; }
    .profile-name { font-family: var(--ff-display); font-size: 20px; font-weight: 700; color: var(--ruby-dark); margin-bottom: 6px; }
    .profile-details { font-size: 13px; color: #666; margin: 4px 0; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .badge-caste { display: inline-block; background: linear-gradient(135deg, #FEF3C7, #FDE68A); color: #92400E; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; margin-top: 8px; }
    .badge-verified { display: inline-block; background: linear-gradient(135deg, #D1FAE5, #A7F3D0); color: #065F46; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; margin-left: 8px; }

    /* Service Cards */
    .service-card {
      background: #fff; border-radius: 24px; padding: 28px; border: none;
      transition: all 0.35s var(--ease); height: 100%;
      box-shadow: var(--sh-sm);
      position: relative;
      overflow: hidden;
    }
    .service-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 5px;
      background: linear-gradient(90deg, var(--ruby), var(--gold));
    }
    .service-card:hover { transform: translateY(-8px); box-shadow: var(--sh-lg); }
    .service-icon { font-size: 42px; margin-bottom: 18px; display: inline-block; }
    .service-card h3 { font-size: 22px; margin-bottom: 16px; color: var(--ruby-dark); }
    .service-card ul { list-style: none; padding-left: 0; }
    .service-card li { padding: 8px 0; font-size: 13.5px; color: var(--ink-soft); border-bottom: 1px dashed var(--border); display: flex; align-items: center; gap: 10px; }
    .service-card li i { color: var(--ruby); width: 20px; font-size: 12px; }

    .package-card {
      background: #fff; border-radius: 24px; padding: 28px; text-align: center;
      transition: all 0.35s var(--ease); border: 1px solid var(--border);
    }
    .package-card:hover { transform: translateY(-8px); box-shadow: var(--sh-lg); border-color: var(--gold); }
    .package-card.featured { border: 2px solid var(--gold); background: linear-gradient(135deg, #fff, var(--gold-pale)); }
    .package-title { font-size: 28px; font-weight: 800; color: var(--ruby); margin-bottom: 8px; font-family: var(--ff-display); }
    .package-subtitle { font-size: 13px; color: var(--gold); font-weight: 700; letter-spacing: 1px; margin-bottom: 20px; text-transform: uppercase; }
    .package-features { list-style: none; text-align: left; margin: 24px 0; }
    .package-features li { padding: 10px 0; font-size: 13px; display: flex; align-items: center; gap: 10px; border-bottom: 1px dashed var(--border); }
    .package-features li i { color: var(--ruby); width: 20px; }

    .videos-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 30px; margin-top: 40px; }
    .video-card { background: #fff; border-radius: 20px; overflow: hidden; border: 1px solid var(--border); transition: all 0.3s; }
    .video-card:hover { transform: translateY(-6px); box-shadow: var(--sh-md); }
    .video-wrapper { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; }
    .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--ruby-dark); margin-bottom: 7px; }
    input, select, textarea { width: 100%; padding: 12px 16px; border: 1.5px solid var(--border); border-radius: 12px; font-family: var(--ff-body); font-size: 14px; background: var(--warm-white); transition: all 0.25s; }
    input:focus, select:focus, textarea:focus { border-color: var(--ruby); box-shadow: 0 0 0 4px rgba(155,27,58,0.08); outline: none; }

    .card { background: rgba(255,255,255,0.96); border-radius: 20px; padding: 32px; border: 1px solid var(--border); box-shadow: var(--sh-xs); transition: all 0.3s var(--ease); }

    .modal { display: none; position: fixed; inset: 0; background: rgba(28,10,20,0.65); backdrop-filter: blur(8px); z-index: 2000; align-items: center; justify-content: center; }
    .modal.show { display: flex; }
    .modal-content { background: #fff; border-radius: 28px; max-width: 520px; width: 100%; animation: modalPop 0.3s var(--ease); }
    .modal-header { padding: 28px 28px 0; display: flex; justify-content: flex-end; }
    .modal-body { padding: 20px 28px 28px; }
    .modal-close { background: var(--ruby-pale); border-radius: 50%; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; }

    .toast { position: fixed; bottom: 28px; right: 28px; padding: 14px 22px; border-radius: 14px; z-index: 3000; animation: slideInRight 0.35s; display: flex; align-items: center; gap: 12px; font-weight: 600; background: var(--jade); color: white; box-shadow: var(--sh-lg); }
    .toast.error { background: linear-gradient(135deg,#C0392B,#E05040); }
    .toast.info { background: linear-gradient(135deg,#1B3D9B,#3A6AD8); }

    footer { background: var(--ruby-deep); color: rgba(255,255,255,0.7); padding: 56px 28px 28px; margin-top: 40px; }
    .footer-inner { max-width: 1300px; margin: 0 auto; display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 48px; }
    .feature-card { background: #fff; border-radius: 22px; padding: 36px 28px; text-align: center; border: 1px solid var(--border); transition: all 0.35s var(--ease); cursor: pointer; }
    .feature-card:hover { transform: translateY(-8px); box-shadow: var(--sh-lg); border-color: var(--border-gold); }
    .feature-icon { width: 74px; height: 74px; border-radius: 20px; display: flex; align-items: center; justify-content: center; margin: 0 auto 22px; font-size: 30px; background: var(--ruby-pale); color: var(--ruby); }

    @media (max-width: 768px) {
      .nav-links { display: none; }
      .menu-toggle { display: block; }
      .footer-inner { grid-template-columns: 1fr; }
      .hero { min-height: 70vh; }
    }
    .empty-state { grid-column: 1 / -1; text-align: center; padding: 60px; color: var(--muted); }
  </style>
</head>
<body>
<div id="app"></div>
<script>
  // ==================== EMAILJS CONFIGURATION ====================
  const EMAILJS_PUBLIC_KEY = "OBwbDluYBz5rNSszX";
  const EMAILJS_SERVICE_ID = "service_s1j030q";
  const EMAILJS_TEMPLATE_ID = "template_xqh5y4i";
  emailjs.init(EMAILJS_PUBLIC_KEY);

  // Company email for enquiries
  const COMPANY_EMAIL = "panneer.v.vtr@gmail.com";

  let registeredUsers = [];
  let currentUser = null;
  let currentPage = "home";

  const TAMIL_DISTRICTS = ["Chennai","Coimbatore","Madurai","Tiruchirappalli","Salem","Tirunelveli","Vellore","Erode","Thanjavur","Dindigul","Kanyakumari","Virudhunagar","Tiruppur","Nagapattinam","Cuddalore","Kanchipuram"];
  const CASTES = ["Brahmin","Mudaliar","Gounder","Nadar","Thevar","Chettiar","Pillai","Naicker","Yadav","Vellalar","Vanniyar"];
  const GRAD_CLASSES = ["avatar-grad-1","avatar-grad-2","avatar-grad-3","avatar-grad-4","avatar-grad-5","avatar-grad-6","avatar-grad-7","avatar-grad-8"];

  function showToast(msg, type = "success") { 
    document.querySelectorAll('.toast').forEach(t=>t.remove());
    let div = document.createElement('div'); 
    div.className = `toast ${type}`; 
    div.innerHTML = `<i class="fas ${type==='success'?'fa-check-circle':type==='error'?'fa-exclamation-circle':'fa-envelope'}"></i> ${msg}`;
    document.body.appendChild(div); 
    setTimeout(()=>div.remove(),4000);
  }

  // Send welcome email to new user
  async function sendWelcomeEmail(email, name) {
    try {
      await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, { 
        email, name, 
        reply_to: COMPANY_EMAIL, 
        from_name: "Thirumana Nilayam", 
        to_name: name 
      });
      showToast(`✓ Welcome email sent to ${email}!`, "success");
      return true;
    } catch(e) { return false; }
  }

  // Send event enquiry email to company
  async function sendEventEnquiryEmail(customerName, customerEmail, customerPhone, eventType, message) {
    try {
      const templateParams = {
        email: COMPANY_EMAIL,
        name: customerName,
        to_name: "M9S Events Team",
        from_name: customerName,
        reply_to: customerEmail,
        message: `
📋 NEW EVENT ENQUIRY RECEIVED

━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

👤 Customer Name: ${customerName}
📧 Email: ${customerEmail}
📞 Phone: ${customerPhone || "Not provided"}
🎉 Event Type: ${eventType || "Wedding/Event"}

📝 Message:
${message || "No additional message provided."}

━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

Please contact the customer at the earliest convenience.

- M9S Event Management System
        `,
        event_type: eventType || "Wedding Planning"
      };
      
      const response = await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, templateParams);
      if (response.status === 200) {
        showToast("✓ Enquiry sent! Our team will contact you shortly.", "success");
        return true;
      }
    } catch (error) {
      console.error("Email sending failed:", error);
      showToast("Failed to send enquiry. Please try again later.", "error");
      return false;
    }
    return false;
  }

  function generateSeedProfiles() {
    let profiles = [];
    let maleNames = ["Arjun", "Karthik", "Senthil", "Prakash", "Vignesh", "Gokul", "Dinesh", "Ramesh"];
    let femaleNames = ["Kavitha", "Meenakshi", "Divya", "Priyanka", "Lakshmi", "Revathi", "Saranya", "Nithya"];
    let surnames = ["Kumar", "Rajan", "Murugan", "Selvam", "Subramanian", "Pillai"];
    let occs = ["Software Engineer", "Doctor", "Teacher", "Business Owner", "Bank Officer", "Civil Engineer"];
    let incomes = ["₹5-8 LPA", "₹8-12 LPA", "₹12-18 LPA", "₹18-25 LPA"];
    for(let i = 0; i < 20; i++){
      let isMale = i % 2 === 0;
      let fn = isMale ? maleNames[i % maleNames.length] : femaleNames[i % femaleNames.length];
      let sn = surnames[i % surnames.length];
      let age = 22 + (i % 16);
      profiles.push({ 
        id: `p${i+1}`, name: `${fn} ${sn}`, age, district: TAMIL_DISTRICTS[i % TAMIL_DISTRICTS.length], 
        caste: CASTES[i % CASTES.length], occupation: occs[i % occs.length], income: incomes[i % incomes.length], 
        about: `I'm a ${occs[i % occs.length]} from ${TAMIL_DISTRICTS[i % TAMIL_DISTRICTS.length]}, family oriented.`, 
        gender: isMale ? "Male" : "Female", email: `${fn.toLowerCase()}${i+1}@example.com`, password: "demo123",
        verified: i % 3 !== 0, premium: i % 5 === 0, gradClass: GRAD_CLASSES[i % GRAD_CLASSES.length],
        prefAgeMin: 22, prefAgeMax: 35
      });
    }
    return profiles;
  }

  function loadData() { 
    let stored = localStorage.getItem("thirumana_m9s_full"); 
    if(stored) registeredUsers = JSON.parse(stored); 
    else registeredUsers = generateSeedProfiles(); 
    saveData(); 
  }
  function saveData() { localStorage.setItem("thirumana_m9s_full", JSON.stringify(registeredUsers)); }
  function getMatches() { 
    if(!currentUser) return []; 
    let opp = currentUser.gender === "Male" ? "Female" : "Male"; 
    return registeredUsers.filter(u => u.id !== currentUser.id && u.gender === opp && 
      u.age >= (currentUser.prefAgeMin || 18) && u.age <= (currentUser.prefAgeMax || 60));
  }
  function getAllExceptCurrent() { return currentUser ? registeredUsers.filter(u => u.id !== currentUser.id) : registeredUsers; }

  function openProfileModal(profile) {
    let modal = document.getElementById('profileModal');
    let bodyDiv = document.getElementById('modalBody');
    if(!modal) return;

    let user = registeredUsers.find(u => u.email.toLowerCase() === email.toLowerCase() && u.password === password);

  window.handleRegister = () => {
    let name = document.getElementById("regName")?.value.trim();
    let email = document.getElementById("regEmail")?.value.trim();
    let password = document.getElementById("regPassword")?.value;
    let confirmPassword = document.getElementById("regConfirmPassword")?.value;
    let gender = document.getElementById("regGender")?.value;
    if(!name || !email || !password) { showToast("Please fill all required fields", "error"); return; }
    if(password !== confirmPassword) { showToast("Passwords do not match", "error"); return; }
    if(password.length < 4) { showToast("Password must be at least 4 characters", "error"); return; }
    if(registeredUsers.some(u => u.email.toLowerCase() === email.toLowerCase())) { showToast("Email already registered", "error"); return; }
    let newUser = { 
      id: `user_${Date.now()}`, name, gender, age: 25, email, password,
      mobile: document.getElementById("regMobile")?.value || "",
      district: "", caste: "", occupation: "", height: "5'6\"", income: "", about: "", verified: true,
      prefAgeMin: 22, prefAgeMax: 35, gradClass: GRAD_CLASSES[Math.floor(Math.random() * GRAD_CLASSES.length)]
    };

    saveData();
    currentUser = newUser;
    showToast(`✓ Account created! Welcome ${name.split(' ')[0]}!`, "success");
    changePage("matricreateprofile");
  };

    currentUser.occupation = document.getElementById("profileOcc")?.value || "";
    currentUser.about = document.getElementById("profileAbout")?.value || "";
    currentUser.prefAgeMin = parseInt(document.getElementById("prefMinAge")?.value) || 22;
    currentUser.prefAgeMax = parseInt(document.getElementById("prefMaxAge")?.value) || 35;
    let idx = registeredUsers.findIndex(u => u.id === currentUser.id);

    saveData();
    sendWelcomeEmail(currentUser.email, currentUser.name);
    showToast(`✓ Profile completed!`, "success");
    changePage("matridashboard");

    let eventTypeSelect = document.getElementById("eventType");

    if(!name) { showToast("Please enter your name", "error"); return; }
    if(!email) { showToast("Please enter your email", "error"); return; }
    
    showToast("Sending enquiry...", "info");
    await sendEventEnquiryEmail(name, email, phone, eventType, message);
    
    // Clear form

    if(document.getElementById("eventPhone")) document.getElementById("eventPhone").value = "";
    if(document.getElementById("eventMessage")) document.getElementById("eventMessage").value = "";
  };

  function MatriCreateProfilePage() { return `${Navbar()}<div class="container" style="max-width:680px;margin:40px auto;"><div class="card"><h2 class="serif" style="color:var(--ruby);">Complete Your Profile</h2><div class="grid-2"><div class="form-group"><label>District</label><select id="profileDistrict">${TAMIL_DISTRICTS.map(d => `<option>${d}</option>`).join('')}</select></div><div class="form-group"><label>Caste</label><select id="profileCaste">${CASTES.map(c => `<option>${c}</option>`).join('')}</select></div><div class="form-group"><label>Occupation</label><input id="profileOcc"></div></div><div class="form-group"><label>About Me</label><textarea id="profileAbout" rows="3"></textarea></div><div class="grid-2"><div class="form-group"><label>Min Age</label><input id="prefMinAge" type="number" value="22"></div><div class="form-group"><label>Max Age</label><input id="prefMaxAge" type="number" value="35"></div></div><button class="btn btn-primary btn-full" onclick="saveProfile()">Save Profile →</button></div></div>`; }
  function MatriDashboardPage() { if(!currentUser) return "Please login"; let matches = getMatches(); return `${Navbar()}<div class="container" style="margin-top:40px;"><div class="card" style="background:linear-gradient(135deg,var(--ruby),var(--ruby-dark));color:white;text-align:center;"><h2>Welcome ${currentUser.name.split(' ')[0]}! 💐</h2><p><strong>${matches.length}</strong> potential matches</p><button class="btn btn-gold" onclick="changePage('matrimatches')">View Matches →</button></div><div style="margin-top:48px;"><h3 class="serif" style="color:var(--ruby);">🌟 Recommended for You</h3><div class="grid-3">${matches.slice(0,6).map(p => ProfileCard(p)).join('')}</div></div></div>${ModalComp()}`; }
  function MatriMatchesPage() { if(!currentUser) return "Please login"; let matches = getMatches(); return `${Navbar()}<div class="container" style="margin:40px auto;"><h2 class="section-title">💖 Your Matches (${matches.length})</h2><div class="grid-3">${matches.length ? matches.map(p => ProfileCard(p)).join('') : '<div class="empty-state">No matches yet</div>'}</div></div>${ModalComp()}`; }
  function EventContactPage() { 
    return `${Navbar()}<div class="container" style="margin:60px auto;"><h2 class="section-title">Plan Your Dream Wedding</h2><div class="grid-2"><div class="card"><h3>Contact Information</h3><p><i class="fas fa-phone"></i> 📞 +91 94439 43933</p><p><i class="fas fa-envelope"></i> ✉️ info@m9s.asia</p><p><i class="fas fa-map-marker-alt"></i> 📍 Chennai, Tamil Nadu</p><p><i class="fab fa-whatsapp"></i> WhatsApp: +91 94439 43933</p><p style="margin-top:16px; font-size:12px; color:var(--muted);">Enquiries sent to: panneer.v.vtr@gmail.com</p></div><div class="card"><h3>Send Enquiry</h3><div class="form-group"><label>Your Name *</label><input id="eventName" placeholder="Full Name"></div><div class="form-group"><label>Email *</label><input type="email" id="eventEmail" placeholder="your@email.com"></div><div class="form-group"><label>Phone Number</label><input id="eventPhone" placeholder="+91 XXXXXXXXXX"></div><div class="form-group"><label>Event Type</label><select id="eventType"><option value="Wedding">Wedding</option><option value="Engagement">Engagement</option><option value="Reception">Reception</option><option value="Birthday">Birthday</option><option value="Corporate Event">Corporate Event</option><option value="Other">Other</option></select></div><div class="form-group"><label>Message / Requirements</label><textarea rows="3" id="eventMessage" placeholder="Tell us about your event..."></textarea></div><button class="btn btn-primary btn-full" onclick="submitEventEnquiry()">Send Enquiry <i class="fas fa-arrow-right"></i></button><p style="font-size:11px; color:var(--muted); margin-top:12px;">* Your enquiry will be sent to our event management team at panneer.v.vtr@gmail.com</p></div></div></div><footer><div class="footer-inner"><div><div class="logo" style="color:var(--gold);">M9S Events</div><p>Premium Wedding Planning & Management</p></div><div><h4>Contact</h4><p>📞 +91 94439 43933</p><p>✉️ info@m9s.asia</p></div></div></footer>`; 
  }

  function toggleMobileMenu() { let menu = document.getElementById("mobileMenu"); if(menu) menu.classList.toggle("show"); }
  function changePage(page) { currentPage = page; render(); }
  function render() {
    let pages = { home: HomePage, events: EventsPage, matrimony: MatrimonyPage, matrilogin: MatriLoginPage, matriregister: MatriRegisterPage, matricreateprofile: MatriCreateProfilePage, matridashboard: MatriDashboardPage, matrimatches: MatriMatchesPage, "event-contact": EventContactPage };
    let app = document.getElementById("app");
    app.innerHTML = (pages[currentPage] || HomePage)();
    window.scrollTo(0, 0);
  }

  window.changePage = changePage; window.toggleMobileMenu = toggleMobileMenu; window.closeModal = closeModal;
  window.sendInterestFromModal = sendInterestFromModal; window.viewProfileDetails = viewProfileDetails;
  window.submitEventEnquiry = submitEventEnquiry; window.handleLogin = handleLogin;
  window.handleRegister = handleRegister; window.saveProfile = saveProfile; window.logout = logout;

  loadData();
  render();
</script>
